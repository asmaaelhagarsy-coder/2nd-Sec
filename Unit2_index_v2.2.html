<html lang='en'>
<head>

<title>Unit 2 – Interactive Mini Platform (v2.2)</title>
<style>
:root{--bg:#fff8fa;--text:#2b1b1b;--brand:#800020;--accent:#e11d48;}


*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
header{background:linear-gradient(90deg,var(--brand),#a8123f);padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0;color:#fffafc}
header .author{margin-left:auto;font-weight:700;color:#ffe7ef}
.container{padding:12px}
.lesson-tabs,.sub-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.lesson-tab,.sub-tab{padding:10px 12px;border-radius:12px;background:#fff;border:2px solid var(--brand);cursor:pointer;font-weight:800;color:#5a0d21;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.lesson-tab.active{background:var(--brand);color:#fff5f7}
.sub-tab.active{background:var(--lesson);color:#5a0d21}
.panel{background:#fff;border-radius:14px;border:2px solid #ffd7e3;padding:12px;min-height:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{border:2px solid #ffd7e3;border-radius:12px;padding:12px;background:#fffdfd}
.card h4{margin:0 0 8px;font-size:18px;color:#5a0d21}
.chip{display:inline-block;background:#fff0f5;color:#5a0d21;border:1px solid #ffd7e3;border-radius:14px;padding:2px 8px;margin-right:6px;font-size:12px}
button{border:none;border-radius:10px;padding:10px 14px;font-weight:800;background:var(--accent);color:#fff5f7;cursor:pointer}
button.ghost{background:#fff;border:2px solid var(--accent);color:#5a0d21}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{border:2px solid #ffd7e3;border-radius:10px;padding:10px;font-size:16px;width:100%}
.hidden{display:none}
.success{background:#e6ffed;border:2px solid #b3f5c0}
.score{font-weight:800;color:#5a0d21}
.drag-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drag-list{display:grid;grid-template-columns:1fr;gap:10px}
.drag-item{background:#fff3f7;border:2px dashed #ffb8cd;border-radius:10px;padding:10px;min-height:56px}
.drag-item[draggable='true']{cursor:grab}
.dropzone{background:#fffbe6;border:2px dashed #ffd27f;min-height:56px}
.ok{background:#e8f5e9;border-color:#a5d6a7}
.bad{background:#ffebee;border-color:#ffcdd2}
.mcq{border:2px dashed #ffd7e3;border-radius:10px;padding:10px}
.mcq .opt{border:2px solid #ffe9f0;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
.mcq .opt.correct{background:#e6ffed;border-color:#b3f5c0}
.mcq .opt.wrong{background:#ffebee;border-color:#ffcdd2}
footer{padding:14px;text-align:center;color:#754}
.note{background:#fff7e6;border:2px solid #ffe0a3;border-radius:12px;padding:10px}

</style>
</head>

const subTabs=document.getElementById('subTabs');
const content=document.getElementById('content');
const unitExamPanel=document.getElementById('unitExam');
let currentLesson=1;

[...document.querySelectorAll('.lesson-tab')].forEach(tab=>{
  if(tab.id==='unitExamTab') return;
  tab.addEventListener('click',()=>{
    [...document.querySelectorAll('.lesson-tab')].forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    unitExamPanel.classList.add('hidden');
    content.classList.remove('hidden');
    currentLesson = parseInt(tab.dataset.lesson,10);
    buildLessonTabs();
  });
});

const unitExamTab=document.getElementById('unitExamTab');
unitExamTab.addEventListener('click',()=>{
  [...document.querySelectorAll('.lesson-tab')].forEach(x=>x.classList.remove('active'));
  unitExamTab.classList.add('active');
  content.classList.add('hidden');
  subTabs.innerHTML='';
  unitExamPanel.classList.remove('hidden');
  buildUnitExam();
});

function buildLessonTabs(){
  const L = lessons[currentLesson];
  subTabs.innerHTML='';
  document.documentElement.style.setProperty('--lesson', L.color);
  (L.tabs||[]).forEach((name,i)=>{
    const st=el(`<div class='sub-tab ${i===0?'active':''}' data-tab='${name}'>${name}</div>`);
    st.addEventListener('click',()=>{
      [...document.querySelectorAll('.sub-tab')].forEach(x=>x.classList.remove('active'));
      st.classList.add('active');
      renderSubTab(name);
    });
    subTabs.appendChild(st);
  });
  renderSubTab((L.tabs||[])[0]);
}

function renderSubTab(name){
  const L = lessons[currentLesson];
  if(name.startsWith('1_')) renderVocabulary(L);
  else if(name.startsWith('2_')) renderGames(L);
  else if(name.startsWith('3_')) renderReading(L);
  else if(name==='Grammar') renderGrammar(L);
}

buildLessonTabs();

function renderVocabulary(L){
  const cards = (L.vocab||[]).map(v=>`<div class='card'>
    <div class='chip'>${L.title}</div>
    <h4>${v.en}</h4>
    <p><strong>Arabic:</strong> ${v.ar}</p>
    <p><em>Example:</em> ${v.ex}</p>
    <div class='row'>
      <button onclick="speech.say('${v.en}', speech.rateWord)">Play word (UK)</button>
      <button class='ghost' onclick="speech.say('${v.ex}', speech.rateSentence)">Play example (slow)</button>
    </div>
  </div>`).join('');
  const test = `<div class='card'>
    <h4>Spelling Test – تسميع مكتوب (عربي ➜ إنجليزي)</h4>
    <p>اكتب الكلمة الإنجليزية الصحيحة حسب المعنى العربي. أصوات تشجيع وحركات عند الإجابة الصحيحة.</p>
    <div id='spellArea'></div>
  </div>`;
  content.innerHTML = `<div class='grid'>${cards}${test}</div>`;
  startSpelling(L.vocab||[]);
}

  const area=document.getElementById('spellArea'); let idx=0, score=0; items=shuffle(items);
  function ask(){ const v=items[idx];
    area.innerHTML = `<div class='mcq'>
      <p class='score'>${idx+1}/${items.length} · Score: ${score}</p>
      <p><strong>المعنى:</strong> ${v.ar}</p>
      <input id='ans' class='input' placeholder='اكتب الكلمة بالإنجليزية' />
      <div class='row' style='margin-top:8px'>
        <button onclick='checkSpell()'>Submit</button>
        <button class='ghost' onclick="speech.say('${v.en}', speech.rateWord)">Hear word</button>
      </div>
    </div>`;
    window.checkSpell = ()=>{
      const val=document.getElementById('ans').value.trim().toLowerCase();
      if(val===(v.en||'').toLowerCase()){
        score++; idx++; area.querySelector('.mcq').classList.add('success'); speech.say('Well done!',1);
        setTimeout(()=>{ if(idx<items.length) ask(); else area.innerHTML=`<div class='success card'><h4>Great job!</h4><p>Your score: ${score}/${items.length}</p></div>`; }, 600);
      }else{ speech.say('Try again',1); }
    }
  } ask();
}

function renderGames(L){
  const pairs=(L.games&&L.games.pairs)||[]; const left=pairs.map(p=>p[0]); const right=pairs.map(p=>p[1]);
  const html=`<div class='grid'>
    <div class='card'>
      <h4>Match the Cards – اسحب الكلمة إلى معناها</h4>
      <div class='drag-wrap'>
        <div><h4>English</h4><div class='drag-list' id='dragLeft'></div></div>
        <div><h4>Arabic</h4><div class='drag-list' id='dragRight'></div></div>
      </div>
    </div>
    <div class='card'>
      <h4>Kahoot‑style: Choose the English from Arabic</h4>
      <div id='kahoot'></div>
    </div>
  </div>`;
  content.innerHTML=html; buildDragDrop(left,right); buildKahootWord(L);
}

function buildDragDrop(left,right){
  const L1=shuffle(left), R1=shuffle(right);
  const dl=document.getElementById('dragLeft');
  const dr=document.getElementById('dragRight');
  dl.innerHTML=L1.map(x=>`<div class='drag-item' draggable='true' data-word='${x}'>${x}</div>`).join('');
  dr.innerHTML=R1.map(x=>`<div class='drag-item dropzone' data-mean='${x}'>${x}</div>`).join('');
  const dItems=[...dl.querySelectorAll('.drag-item[draggable]')]; dItems.forEach(it=>{ it.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',it.dataset.word)}); });
  [...dr.querySelectorAll('.dropzone')].forEach(zone=>{
    zone.addEventListener('dragover',e=>e.preventDefault());
    zone.addEventListener('drop',e=>{
      const w=e.dataTransfer.getData('text'); const mean=zone.dataset.mean;
      const ok = Object.values(lessons).some(L=>L.games && L.games.pairs.some(p=>p[0]===w && p[1]===mean));
      if(ok){ zone.classList.add('ok'); zone.innerHTML=`${mean} ✓ <span class='chip'>${w}</span>`; speech.say(w, speech.rateWord); }
      else{ zone.classList.add('bad'); speech.say('Try again',1); }
    });
  });
}

function buildKahootWord(L){
  const area=document.getElementById('kahoot'); let idx=0, score=0;
  const bank = shuffle(L.vocab||[]).map(v=>({word:v.en, ar:v.ar}));
  function ask(){ const item=bank[idx];
    const distractors = shuffle((L.vocab||[]).filter(x=>x.en!==item.word)).slice(0,3).map(x=>x.en);
    const options = shuffle([item.word, ...distractors]);
    area.innerHTML=`<div class='mcq'>
      <p class='score'>${idx+1}/${bank.length} · Score: ${score}</p>
      <p><strong>Arabic meaning:</strong> ${item.ar}</p>
      ${options.map(o=>`<div class='opt' data-val='${o}'>${o}</div>`).join('')}
    </div>`;
    [...area.querySelectorAll('.opt')].forEach(opt=>{
      opt.addEventListener('click',()=>{
        const val=opt.dataset.val;
        if(val===item.word){ opt.classList.add('correct'); score++; speech.say('Excellent!',1); }
        else{ opt.classList.add('wrong'); speech.say('Correct: ' + item.word, 0.95);
          const c=[...area.querySelectorAll('.opt')].find(x=>x.dataset.val===item.word); c.classList.add('correct'); }
        setTimeout(()=>{ idx++; (idx<bank.length)?ask():area.innerHTML=`<div class='success card'><h4>Well done!</h4><p>Your score: ${score}/${bank.length}</p></div>` }, 800);
      });
    });
  } ask();
}

function renderReading(L){
  const s=L.reading||[];
  content.innerHTML = `<div class='grid'>
    ${s.map((t,i)=>`<div class='card'><h4>Sentence ${i+1}</h4><p>${t}</p><div class='row'><button class='ghost' onclick="speech.say('${t}', speech.rateSentence)">Play (UK, slow)</button></div></div>`).join('')}
    <div class='card'><h4>Mini MCQ on Words</h4><div id='readMcq'></div></div>
  </div>`;
  buildReadMcq(L);
}

function buildReadMcq(L){
  const area=document.getElementById('readMcq'); const sample = shuffle(L.vocab||[]).slice(6); let idx=0, score=0;
  function ask(){ const v=sample[idx]; const options = shuffle([v.en, ...shuffle(L.vocab||[]).filter(x=>x.en!==v.en).slice(0,3).map(x=>x.en)]);
    area.innerHTML=`<div class='mcq'>
      <p class='score'>${idx+1}/${sample.length} · Score: ${score}</p>
      <p><strong>المعنى:</strong> ${v.ar}</p>
      ${options.map(o=>`<div class='opt' data-val='${o}'>${o}</div>`).join('')}
    </div>`;
    [...area.querySelectorAll('.opt')].forEach(opt=>{
      opt.addEventListener('click',()=>{
        const val=opt.dataset.val;
        if(val===v.en){ opt.classList.add('correct'); score++; speech.say('Great!',1); }
        else{ opt.classList.add('wrong'); speech.say('Correct is ' + v.en,1); const c=[...area.querySelectorAll('.opt')].find(x=>x.dataset.val===v.en); c.classList.add('correct'); }
        setTimeout(()=>{ idx++; (idx<sample.length)?ask():area.innerHTML=`<div class='success card'><h4>Nice!</h4><p>Your score: ${score}/${sample.length}</p></div>` }, 800);
      });
    });
  } ask();
}

function renderGrammar(L){
  content.innerHTML = `<div class='card'>${L.grammar.explain}</div><div id='gramControls' class='row'><button class='ghost' id='retryGram'>Retry Grammar</button></div><div id='gramQs'></div>`;
  const area=document.getElementById('gramQs');
  function start(){ let idx=0, score=0; const qs=shuffle(L.grammar.qs);
    function ask(){ const Q=qs[idx]; if(!Q){ area.innerHTML=`<div class='success card'><h4>Grammar Practice Done</h4><p>Your score: ${score}/${qs.length}</p></div>`; return }
      const options=shuffle([...Q.opts]);
      area.innerHTML=`<div class='mcq'>
        <p class='score'>${idx+1}/${qs.length} · Score: ${score}</p>
        <p>${Q.q.replace('___','__________')}</p>
        ${options.map(o=>`<div class='opt' data-val='${o}'>${o}</div>`).join('')}
      </div>`;
      [...area.querySelectorAll('.opt')].forEach(opt=>{
        opt.addEventListener('click',()=>{
          const val=opt.dataset.val;
          if(val===Q.ans){ opt.classList.add('correct'); score++; speech.say('Well done!',1); }
          else{ opt.classList.add('wrong'); speech.say('Correct is ' + Q.ans,1); const c=[...area.querySelectorAll('.opt')].find(x=>x.dataset.val===Q.ans); c.classList.add('correct'); }
          setTimeout(()=>{ idx++; ask(); }, 800);
        });
      });
    }
    ask();
    document.getElementById('retryGram').onclick=()=>{ start(); };
  }
  start();
}

function buildUnitExam(){
  const area=unitExamPanel; let idx=0, score=0; const qs=shuffle(UNIT_EXAM);
  function ask(){ if(idx>=qs.length){ area.innerHTML=`<div class='success card'><h4>Unit Exam Completed</h4><p>Your score: ${score}/${qs.length}</p><div class='row'><button class='ghost' id='retryExam'>Retry Exam</button></div></div>`; document.getElementById('retryExam').onclick=()=>{ idx=0; score=0; const reshuffle=shuffle(UNIT_EXAM); qs.splice(0,qs.length,...reshuffle); ask(); }; return }
    const Q=qs[idx]; const options=shuffle([...Q.opts]);
    area.innerHTML = `<div class='mcq'>
      <p class='score'>${idx+1}/${qs.length} · Score: ${score}</p>
      <p>${Q.q}</p>
      ${options.map(o=>`<div class='opt' data-val='${o}'>${o}</div>`).join('')}
      <div class='row' style='margin-top:8px'><button class='ghost' id='retryExam'>Retry Exam</button></div>
    </div>`;
    document.getElementById('retryExam').onclick=()=>{ idx=0; score=0; const reshuffle=shuffle(UNIT_EXAM); qs.splice(0,qs.length,...reshuffle); ask(); };
    [...area.querySelectorAll('.opt')].forEach(opt=>{
      opt.addEventListener('click',()=>{
        const val=opt.dataset.val;
        if(val===Q.ans){ opt.classList.add('correct'); score++; speech.say('Great!',1); }
        else{ opt.classList.add('wrong'); speech.say('Correct answer is ' + Q.ans,1); const c=[...area.querySelectorAll('.opt')].find(x=>x.dataset.val===Q.ans); c.classList.add('correct'); }
        setTimeout(()=>{ idx++; ask(); }, 800);
      });
    });
  }
  ask();
}

content.classList.remove('hidden'); unitExamPanel.classList.add('hidden');
</script>
